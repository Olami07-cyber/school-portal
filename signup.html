<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up </title>
    <link rel="stylesheet" href="./styles/signup.css">
    <script src="./signup.js"></script>
</head>
<body>
    <div class="container">
        <div id="register">
            <h1>Student Registration</h1>
        </div>

        <div id="form">
            <form>
                <label>SURNAME</label><br>
                <input type="text" placeholder="Enter your surname name"><br><br>
        
                <label>FIRST NAME</label><br>
                <input type="text" placeholder="Enter your first name"><br><br>
        
                <label>OTHER NAME</label><br>
                <input type="text" placeholder="Enter your other name"><br><br>
        
                <label>DEPARTMENT</label><br>
                <input type="text" placeholder="department"><br><br>
        
                <label>MATRIC NUMBER</label><br>
                <input type="text" placeholder="Enter your matric number"><br><br>
        
                <label>EMAIL</label><br>
                <input type="text" placeholder="Enter your email address"><br><br>
              <button type="submit">Register</button>
           </form>
          </div>
    <div id="back">
        <a href="./index.html">back to home page</a> 
        </div>
    </div>
</body>
</html>
