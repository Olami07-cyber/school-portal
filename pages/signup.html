<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | School Portal</title>
    <link rel="stylesheet" href="../assets/styles/login.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="signup-title">
            <div class="brand"><div class="brand-icon">SP</div><span>SCHOOL PORTAL</span></div>
            <div class="heading"><h1 id="signup-title">Create your account</h1><p>Enter your student information to access the portal.</p></div>
            <form>
                <div class="input-group"><label for="fullName">Full Name</label><input type="text" id="fullName" placeholder="Enter your full name" required></div>
                <div class="input-group"><label for="department">Department</label><input type="text" id="department" placeholder="Enter your department" required></div>
                <div class="input-group"><label for="signupEmail">Email Address</label><input type="email" id="signupEmail" placeholder="student@school.edu" required></div>
                <div class="input-group"><label for="signupMatric">Matric Number</label><input type="text" id="signupMatric" placeholder="ENG/2023/0142" required></div>
                <div class="input-group"><label for="signupPassword">Password</label><input type="password" id="signupPassword" placeholder="Create a password" required></div>
                <div class="input-group"><label for="signupConfirmPassword">Confirm Password</label><input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required></div>
                <button type="submit" class="submit-btn">Create account</button>
            </form>
            <div class="switch-auth"><span>Already have an account?</span><a href="./login.html">Sign in</a></div>
            <div class="footer">Copyright 2026 School Portal</div>
        </section>
    </main>
</body>
</html>
